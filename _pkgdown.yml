url: https://vagishhemmige.github.io/CDCAtlas

template:
  bootstrap: 5
  bootswatch: flatly
  logo: man/figures/logo.png
  favicon: man/figures/favicon.png
  includes:
    in_header: |
      <meta name="google-site-verification" content="TBumihuxSFxK8muRvdo69ca7bmvzWmy-3OMfCZ2692A" />

home:
  title: "CDCAtlas"
  description: "An R package for accessing and analyzing CDC AtlasPlus public health data."
  links:
    # URLs as recorded in reference/web-sources.md. AtlasPlus's Technical
    # Notes are a panel inside the application, with no URL of their own.
    - text: CDC AtlasPlus (technical notes in its menu)
      href: https://gis.cdc.gov/grasp/nchhstpatlas/main.html
    - text: About AtlasPlus (CDC)
      href: https://www.cdc.gov/nchhstp/about/atlasplus.html
    - text: AtlasPlus glossary (PDF)
      href: https://gis.cdc.gov/grasp/nchhstpatlas/Content/docs/AtlasPlusGlossary.pdf

navbar:
  structure:
    left: [intro, reference, articles]
    right: [search, github]
  components:
    intro:
      text: Get started
      href: articles/getting-started.html
    github:
      icon: fab fa-github
      href: https://github.com/VagishHemmige/CDCAtlas
      aria-label: GitHub

reference:
  - title: "Data Access"
    desc: Download data from CDC AtlasPlus, and manage saved downloads.
    contents:
      - get_atlas
      - clear_atlas_cache
  - title: "Estimates below county level"
    desc: Fill in suppressed counts, report cases with no county, and share county counts across tracts or block groups.
    contents:
      - impute_suppressed
      - no_county_cases
      - extrapolate_from_county

articles:
  - title: "Getting started"
    navbar: ~
    contents:
      - articles/getting-started
  - title: "Extrapolation of county data to tracts"
    navbar: ~
    contents:
      - articles/extrapolation
