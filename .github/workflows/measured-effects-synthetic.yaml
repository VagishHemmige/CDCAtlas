# Exercises the measured-effects script (data-raw/measured-effects.R) on
# made-up data, on pull requests that change the script, the report functions
# it calls, the made-up test data or the two measured-effects workflows.
#
# It runs the script in synthetic mode, on the made-up CDC and Census data of
# the offline tests. It is given no Census API key, and its script step sends
# every network request to a proxy that does not exist, so it cannot reach CDC
# AtlasPlus or the Census. Everything it produces is labelled SYNTHETIC: the
# file names, a column in both CSV files, the metadata, the log markers, the
# job summary and the artifact (`measured-effects-synthetic`). It exercises
# the whole path: script, both tables, printing, job summary and upload.
#
# The real-data run is a separate workflow, measured-effects.yaml, started by
# a label or by hand. Adding a label does not start this one.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/measured-effects.yaml"
      - ".github/workflows/measured-effects-synthetic.yaml"
      - "data-raw/measured-effects.R"
      - "R/pipeline-report.R"
      - "tests/testthat/helper-pipeline.R"
      - "tests/testthat/helper-pipeline-report.R"

name: measured-effects-synthetic.yaml

permissions: read-all

jobs:
  # Made-up data only. No secret other than the job's own token is used.
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: measured-effects-synthetic-${{ github.ref }}
      cancel-in-progress: true
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: "true"

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgload, any::testthat
          needs: check

      # The proxy settings point at a port nothing listens on, so a request
      # to CDC AtlasPlus or the Census could not leave this step even if the
      # script tried to send one.
      - name: Build the SYNTHETIC summary (made-up data, no network)
        env:
          MEASURED_EFFECTS_SYNTHETIC: "true"
        run: |
          blocked="http://127.0.0.1:9"
          export http_proxy="$blocked" https_proxy="$blocked" all_proxy="$blocked"
          export HTTP_PROXY="$blocked" HTTPS_PROXY="$blocked" ALL_PROXY="$blocked"
          export no_proxy="" NO_PROXY=""
          Rscript data-raw/measured-effects.R "$RUNNER_TEMP/measured-effects-synthetic"

      - name: Upload the SYNTHETIC summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: measured-effects-synthetic
          path: ${{ runner.temp }}/measured-effects-synthetic/SYNTHETIC-*
          if-no-files-found: warn
