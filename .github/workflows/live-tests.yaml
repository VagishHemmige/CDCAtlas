# Runs the live tests (tests/testthat/test-live-*.R) against CDC AtlasPlus and
# the Census API, only on request:
#
# - add the `live-tests` label to a pull request (remove and re-add it to run
#   again after more pushes): every live test, 35 to 45 minutes; or
# - Actions tab -> live-tests.yaml -> Run workflow, on any branch, choosing
#   which tests:
#   - quick: test-live-cdc.R, a few small requests, about a minute;
#   - pipeline: test-live-pipeline.R, county downloads and the full pipeline;
#   - all: both.
#
# Run every live test when the download, imputation or extrapolation code
# changes; a quick run when only a request, label or code-table check does.
#
# Needs the CENSUS_API_KEY repository secret. GitHub does not pass secrets to
# pull requests from forks, so this works only for branches in this repository.
# Fails if any live test fails or skips: a skip here means a test did not run.
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      tests:
        description: "Which live tests to run"
        type: choice
        options: [all, quick, pipeline]
        default: all

name: live-tests.yaml

permissions: read-all

jobs:
  live-tests:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'live-tests'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: live-tests-${{ github.ref }}
      cancel-in-progress: true
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
      CDCATLAS_LIVE_TESTS: "true"
      NOT_CRAN: "true"
      # The label always runs every live test.
      LIVE_TESTS: ${{ inputs.tests || 'all' }}

    steps:
      - name: Check the Census API key is set
        run: |
          if [ -z "$CENSUS_API_KEY" ]; then
            echo "::error::CENSUS_API_KEY is not set. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, local::.
          needs: check

      - name: Run live tests
        run: |
          filter <- switch(
            Sys.getenv("LIVE_TESTS"),
            all = "live",
            quick = "live-cdc",
            pipeline = "live-pipeline",
            stop("Unknown choice of live tests: ", Sys.getenv("LIVE_TESTS"))
          )
          message("Running live tests matching '", filter, "'.")
          res <- as.data.frame(testthat::test_local(
            filter = filter,
            reporter = "progress",
            stop_on_failure = TRUE
          ))
          # A skip at the top of a test file leaves no rows, so check both.
          if (nrow(res) == 0) {
            stop("No live tests ran: check CDCATLAS_LIVE_TESTS and that CDC is reachable.")
          }
          if (any(res$skipped)) {
            stop("Live tests skipped: ", paste(unique(res$test[res$skipped]), collapse = "; "))
          }
        shell: Rscript {0}
