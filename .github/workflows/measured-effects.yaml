# Builds the measured-effects summary (data-raw/measured-effects.R): what each
# pipeline step does to the numbers, on real CDC AtlasPlus and Census data.
# It runs the national pipeline for every year and stratification asked for,
# so allow one to two hours.
#
# Runs:
# - on request: Actions tab -> measured-effects.yaml -> Run workflow, on any
#   branch, choosing the years and stratifications (this works only once this
#   file is on the default branch); and
# - on pull requests that change this file, the script or the report function
#   it calls, so a change to how the summary is built is tried on real data.
#
# It does not commit anything: the workflow has read-only permissions. The
# two files it writes are uploaded as the `measured-effects` artifact, and a
# person commits them to `vignettes/articles/data/` in a pull request.
#
# Needs the CENSUS_API_KEY repository secret. GitHub does not pass secrets to
# pull requests from forks, so this works only for branches in this
# repository. Fails if any year and stratification failed; the artifact is
# uploaded either way, and its metadata says which.
on:
  pull_request:
    paths:
      - ".github/workflows/measured-effects.yaml"
      - "data-raw/measured-effects.R"
      - "R/pipeline-report.R"
  workflow_dispatch:
    inputs:
      years:
        description: "Years, comma-separated; 'latest' is the newest year CDC has released"
        type: string
        default: "2017,2022,latest"
      stratifications:
        description: "Stratifications, comma-separated: none, sex, age, race"
        type: string
        default: "none,sex,age,race"
      alternatives:
        description: "Imputation alternatives: zero, cap_inf, floor_1, acs; or none"
        type: string
        default: "zero,cap_inf,floor_1,acs"

name: measured-effects.yaml

permissions: read-all

jobs:
  measured-effects:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: measured-effects-${{ github.ref }}
      cancel-in-progress: true
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
      NOT_CRAN: "true"
      # A pull request uses the script's defaults.
      MEASURED_YEARS: ${{ inputs.years }}
      MEASURED_STRATIFICATIONS: ${{ inputs.stratifications }}
      MEASURED_ALTERNATIVES: ${{ inputs.alternatives }}

    steps:
      - name: Check the Census API key is set
        run: |
          if [ -z "$CENSUS_API_KEY" ]; then
            echo "::error::CENSUS_API_KEY is not set. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      # On a pull request, build from the branch's own commit rather than the
      # merge commit, so the commit recorded in the metadata is one that
      # exists on the branch.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgload, any::tidycensus
          needs: check

      - name: Build the summary
        run: Rscript data-raw/measured-effects.R vignettes/articles/data

      - name: Upload the summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: measured-effects
          path: |
            vignettes/articles/data/measured-effects.csv
            vignettes/articles/data/measured-effects-meta.json
          if-no-files-found: warn
