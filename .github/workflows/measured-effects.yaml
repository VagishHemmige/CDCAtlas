# Builds the measured-effects summary (data-raw/measured-effects.R): what each
# pipeline step does to the numbers.
#
# READ FIRST: real-data output is public.
# This repository is public, so everything a job shows is public: its log, its
# job summary and its artifacts. Figures computed from real CDC AtlasPlus data
# may only be shown or uploaded here as far as the maintainer has decided they
# may be distributed. Until that decision is recorded, do not run the
# real-data job. That is why, by default, the real-data job prints no figures,
# writes no job summary, uploads only the compact summary and the metadata,
# and uploads nothing at all if the run failed.
#
# Two jobs, and which one runs depends only on what started the workflow:
#
# - `synthetic`, on pull requests that change this file, the script, the
#   report functions it calls or the made-up test data. It runs the script in
#   synthetic mode, on the made-up CDC and Census data of the offline tests.
#   It is given no Census API key, and its script step sends every network
#   request to a proxy that does not exist, so it cannot reach CDC AtlasPlus
#   or the Census. Everything it produces is labelled SYNTHETIC: the file
#   names, a column in both CSV files, the metadata, the log markers, the job
#   summary and the artifact (`measured-effects-synthetic`). It exercises the
#   whole path: script, both tables, printing, job summary and upload.
#
# - `real-data`, only on request (Actions tab -> measured-effects.yaml -> Run
#   workflow), which works only once this file is on the default branch. It
#   runs the national pipeline against CDC AtlasPlus and the Census for every
#   year and stratification asked for: allow one to two hours. A pull request
#   or a push can never start it. Inputs:
#   - years, stratifications, alternatives: the scope;
#   - upload_detail (default off): also upload the detail table, which has
#     figures for every state and group;
#   - print_summary (default off): also print the compact summary and the
#     metadata to the log, between BEGIN and END marker lines, and add a
#     short table to the job summary.
#
# Neither job commits anything: the workflow has read-only permissions. A
# person commits the compact summary (measured-effects.csv) and the metadata
# to `vignettes/articles/data/` in a pull request; the detail table is
# git-ignored there.
#
# The real-data job needs the CENSUS_API_KEY repository secret, and fails if
# any year and stratification failed.
on:
  pull_request:
    paths:
      - ".github/workflows/measured-effects.yaml"
      - "data-raw/measured-effects.R"
      - "R/pipeline-report.R"
      - "tests/testthat/helper-pipeline.R"
      - "tests/testthat/helper-pipeline-report.R"
  workflow_dispatch:
    inputs:
      years:
        description: "Years, comma-separated; 'latest' is the newest year CDC has released"
        type: string
        default: "2017,2022,latest"
      stratifications:
        description: "Stratifications, comma-separated: none, sex, age, race"
        type: string
        default: "none,sex,age,race"
      alternatives:
        description: "Imputation alternatives: zero, cap_inf, floor_1, acs; or none"
        type: string
        default: "zero,cap_inf,floor_1,acs"
      upload_detail:
        description: "Also upload the detail table (figures for every state and group). Public."
        type: boolean
        default: false
      print_summary:
        description: "Also print the compact summary to the log and the job summary. Public."
        type: boolean
        default: false

name: measured-effects.yaml

permissions: read-all

jobs:
  # Made-up data only. No secret is passed to this job.
  synthetic:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: measured-effects-synthetic-${{ github.ref }}
      cancel-in-progress: true
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: "true"

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgload, any::testthat
          needs: check

      # The proxy settings point at a port nothing listens on, so a request
      # to CDC AtlasPlus or the Census could not leave this step even if the
      # script tried to send one.
      - name: Build the SYNTHETIC summary (made-up data, no network)
        env:
          MEASURED_EFFECTS_SYNTHETIC: "true"
          http_proxy: "http://127.0.0.1:9"
          https_proxy: "http://127.0.0.1:9"
          HTTP_PROXY: "http://127.0.0.1:9"
          HTTPS_PROXY: "http://127.0.0.1:9"
          no_proxy: ""
          NO_PROXY: ""
        run: Rscript data-raw/measured-effects.R "$RUNNER_TEMP/measured-effects-synthetic"

      - name: Upload the SYNTHETIC summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: measured-effects-synthetic
          path: ${{ runner.temp }}/measured-effects-synthetic/SYNTHETIC-*
          if-no-files-found: warn

  # Real CDC AtlasPlus and Census data. Only ever started by hand.
  real-data:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: measured-effects-real-${{ github.ref }}
      cancel-in-progress: true
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
      NOT_CRAN: "true"
      MEASURED_YEARS: ${{ inputs.years }}
      MEASURED_STRATIFICATIONS: ${{ inputs.stratifications }}
      MEASURED_ALTERNATIVES: ${{ inputs.alternatives }}
      MEASURED_PRINT_SUMMARY: ${{ inputs.print_summary && 'true' || 'false' }}
      MEASURED_EFFECTS_SYNTHETIC: "false"

    steps:
      - name: Check the Census API key is set
        run: |
          if [ -z "$CENSUS_API_KEY" ]; then
            echo "::error::CENSUS_API_KEY is not set. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgload, any::tidycensus
          needs: check

      - name: Build the summary from real data
        run: Rscript data-raw/measured-effects.R vignettes/articles/data

      # Nothing is uploaded from a failed run.
      - name: Upload the compact summary and the metadata
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: measured-effects
          path: |
            vignettes/articles/data/measured-effects.csv
            vignettes/articles/data/measured-effects-meta.json
          if-no-files-found: error

      - name: Upload the detail table
        if: success() && inputs.upload_detail
        uses: actions/upload-artifact@v4
        with:
          name: measured-effects-detail
          path: vignettes/articles/data/measured-effects-detail.csv
          if-no-files-found: error
