# Fails when the committed man/, NAMESPACE or DESCRIPTION's RoxygenNote do not
# match what roxygen2 generates from R/. Fix by commenting `/document` on the PR
# (see pr-commands.yaml) or by running devtools::document() locally.
# This workflow never commits.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: document-check.yaml

permissions: read-all

jobs:
  document-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::roxygen2
          needs: roxygen2

      - name: Document
        run: roxygen2::roxygenise()
        shell: Rscript {0}

      - name: Check generated files are committed
        run: |
          changes="$(git status --porcelain -- man NAMESPACE DESCRIPTION)"
          if [ -n "$changes" ]; then
            echo "::error::Documentation is out of date. Comment /document on the PR or run devtools::document()."
            echo "$changes"
            git diff -- man NAMESPACE DESCRIPTION
            exit 1
          fi
